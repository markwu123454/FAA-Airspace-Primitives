name: Update airspace data

on:
  schedule:
    # FAA NASR/CIFP cycles every 28 days. Run at 10:00 UTC on each cycle date
    # (data goes live ~04:01 UTC; 10:00 UTC gives margin).
    # Cycle dates for 2026-2027 — update this list each year.
    - cron: "0 10 11 6 *"    # 2026-06-11
    - cron: "0 10 9 7 *"     # 2026-07-09
    - cron: "0 10 6 8 *"     # 2026-08-06
    - cron: "0 10 3 9 *"     # 2026-09-03
    - cron: "0 10 1 10 *"    # 2026-10-01
    - cron: "0 10 29 10 *"   # 2026-10-29
    - cron: "0 10 26 11 *"   # 2026-11-26
    - cron: "0 10 24 12 *"   # 2026-12-24
  workflow_dispatch:
    inputs:
      cycle_date:
        description: "CIFP cycle date (YYMMDD, e.g. 260514). Leave blank to auto-detect."
        required: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve cycle date
        id: cycle
        run: |
          if [ -n "${{ github.event.inputs.cycle_date }}" ]; then
            echo "date=${{ github.event.inputs.cycle_date }}" >> "$GITHUB_OUTPUT"
          else
            python3 - <<'EOF'
          import datetime, os
          anchor = datetime.datetime(2026, 5, 14)
          today = datetime.datetime.utcnow()
          days = (today - anchor).days
          cycle = anchor + datetime.timedelta(days=(days // 28) * 28)
          date_str = cycle.strftime("%y%m%d")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"date={date_str}\n")
          print(f"Resolved cycle date: {date_str}")
          EOF
          fi

      - name: Parse CIFP
        run: python3 parse_cifp.py --cycle "${{ steps.cycle.outputs.date }}"

      - name: Check for changes
        id: diff
        run: |
          if git status --porcelain airspace.json | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated JSON
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add airspace.json
          git commit -m "Update airspace data — CIFP cycle ${{ steps.cycle.outputs.date }}"
          git push
